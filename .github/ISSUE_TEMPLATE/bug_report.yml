name: Bug report
description: Something didn't work, or touched the mouse/keyboard/focus when it shouldn't have
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The tool call (or recipe step) and its full answer.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: program
    attributes:
      label: Target program and version
      placeholder: e.g. Notepad 11.2508, Calculator, a custom Win32 app
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 25H2 (26200)
    validations:
      required: true
  - type: textarea
    id: tree
    attributes:
      label: tree() output around the target (optional)
      render: text
