[project]
name = "hands-off-mcp"
version = "0.1.0"
description = "MCP server that lets an AI agent drive Windows programs without touching your mouse, keyboard or focus."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Mare Alta" }]
keywords = ["mcp", "windows", "ui-automation", "uia", "agent", "claude", "automation"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "mcp>=1.10",
    "pywin32>=306",
    "uiautomation>=2.0.20",
    "pillow>=10",
    "windows-capture>=2.0",
]

[project.scripts]
hands-off-mcp = "hands_off.server:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hands_off"]
